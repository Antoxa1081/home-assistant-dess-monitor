name: Release

# Manual release: Actions → Release → Run workflow.
# Runs the test suite, bumps the version in manifest.json, commits it to main,
# tags vX.Y.Z and publishes a GitHub Release with notes built from the commits
# since the previous tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored when an explicit version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version, e.g. 0.5.0 or 0.4.7.1 (optional)"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # full history + tags for the release notes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump manifest version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python .github/scripts/bump_version.py "$BUMP" "$EXPLICIT_VERSION")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Build release notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          range="${prev:+${prev}..}HEAD"
          {
            echo "### Changes"
            echo
            git log "$range" --no-merges --reverse --format='- %s (%h)' \
              | grep -v -E '^- Bump manifest to ' || echo "- Maintenance release"
            merged=""
            for sha in $(git log "$range" --merges --reverse --format='%H'); do
              subject="$(git log -1 --format='%s' "$sha")"
              [[ "$subject" =~ ^Merge\ pull\ request\ (#[0-9]+)\ from\ ([^/:]+) ]] || continue
              # GitHub puts the PR title on the first body line of the merge commit.
              title="$(git log -1 --format='%b' "$sha" | sed -n '/./{p;q}')"
              merged+="- ${title:-PR} (${BASH_REMATCH[1]} by @${BASH_REMATCH[2]})"$'\n'
            done
            if [ -n "$merged" ]; then
              echo
              echo "### Merged pull requests"
              echo
              printf '%s' "$merged"
            fi
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${prev}...v${VERSION}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dess_monitor/manifest.json
          git commit -m "Bump manifest to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          # Fails (and publishes nothing) if main moved since checkout.
          git push --atomic origin HEAD:main "v${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
