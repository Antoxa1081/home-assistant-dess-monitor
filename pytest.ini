[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
# The suite is async-heavy (SDK, mapping, streaming, transports). auto mode lets
# bare ``async def test_*`` run without a per-test marker. pytest-asyncio ships
# with pytest-homeassistant-custom-component (hass job) and is installed in the
# lightweight matrix too — see .github/workflows/tests.yml.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
